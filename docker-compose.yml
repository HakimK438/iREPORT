# One command: docker compose up --build
# API: http://localhost:8000/api/v1   Docs: http://localhost:8000/api/docs   MinIO console: http://localhost:9001
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ireport
      POSTGRES_PASSWORD: ireport
      POSTGRES_DB: ireport
    ports: ["${POSTGRES_HOST_PORT:-5434}:5432"]   # 5434 on the host so it does not clash with a local PostgreSQL
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ireport -d ireport"]
      interval: 3s
      retries: 20

  minio:
    # The minio/minio Docker Hub image is no longer published; Chainguard ships the same server.
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  api:
    build: { context: ./backend, target: runtime }
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://ireport:ireport@postgres:5432/ireport
      S3_ENDPOINT: minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-localhost:9000}
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }

  # docker compose --profile test run --rm tests
  tests:
    profiles: [test]
    build: { context: ./backend, target: test }
    environment:
      DATABASE_URL: postgresql+asyncpg://ireport:ireport@postgres:5432/ireport_test
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
